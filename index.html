<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Valentine</title>

<style>
  :root{
    --pink1:#ff9ecb;
    --pink2:#ff4d6d;
    --white: #fff;
  }

  *{ box-sizing:border-box; }

  body{
    margin:0;
    min-height:100vh;
    font-family:Arial, sans-serif;
    color:white;
    background:linear-gradient(45deg,var(--pink1),var(--pink2));
    overflow:hidden;

    /* Mobile-first centering */
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 20px 14px calc(20px + env(safe-area-inset-bottom));
  }

  .card{
    width:min(420px, 100%);
    text-align:center;
    padding: 18px 16px 22px;
    border-radius:18px;
    background: rgba(255,255,255,0.14);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    box-shadow: 0 12px 30px rgba(0,0,0,0.18);
    position:relative;
  }

  h2{
    margin: 6px 0 8px;
    font-size: clamp(18px, 4.8vw, 22px);
    line-height:1.25;
    font-weight:700;
  }

  h3{
    margin: 0 0 14px;
    font-size: clamp(14px, 4vw, 18px);
    font-weight:600;
    opacity:0.95;
  }

  .btn{
    width: 100%;
    max-width: 320px;
    padding: 14px 16px;
    font-size: 16px;
    border: none;
    border-radius: 14px;
    cursor: pointer;
    margin: 8px auto;
    display:block;
    font-weight:700;
  }

  #play{
    background: var(--white);
    color: var(--pink2);
  }

  .row{
    display:flex;
    gap: 10px;
    justify-content:center;
    margin-top: 6px;
    position:relative;
    height: 58px; /* reserved space so layout doesn't jump */
  }

  #yes{
    flex:1;
    max-width: 160px;
    background: var(--white);
    color: var(--pink2);
  }

  /* No button lives inside the row, not the page */
  #no{
    flex:1;
    max-width: 160px;
    background:#e9e9e9;
    color:#333;
    position:absolute;
    right: 0;
    top: 0;
    height: 52px;
  }

  .hint{
    margin-top: 10px;
    font-size: 12px;
    opacity: 0.85;
  }

  .hearts{
    position:fixed;
    font-size:24px;
    animation:float 3s linear infinite;
    pointer-events:none;
  }

  @keyframes float{
    from{ transform:translateY(110vh); }
    to{ transform:translateY(-10vh); }
  }

  .success{
    font-size: clamp(26px, 7vw, 38px);
    margin: 0;
    padding: 18px 0 0;
  }
</style>
</head>

<body>

  <div class="card" id="card">
    <div id="content">
      <h2>Hey… you make my world brighter every day ❤️ — REN</h2>
      <h3>Will you be my Valentine?</h3>

      <button class="btn" id="play" onclick="playMusic()">Play Me 🎵</button>

      <div class="row" id="row">
        <button class="btn" id="yes" onclick="yes()">Yes</button>
        <button class="btn" id="no">No</button>
      </div>

      <div class="hint">Tip: Tap “Play Me” first (phones block autoplay).</div>
    </div>
  </div>

  <audio id="music" src="Edd_Sheeran_-_Perfect_(mp3.pm).mp3" loop></audio>

<script>
  const noBtn = document.getElementById("no");
  const row = document.getElementById("row");
  let scale = 1;

  // Move "No" within the button row bounds (mobile-friendly)
  function moveNo(){
    const pad = 4;
    const rowRect = row.getBoundingClientRect();
    const btnRect = noBtn.getBoundingClientRect();

    const maxX = rowRect.width - btnRect.width - pad;
    const maxY = rowRect.height - btnRect.height - pad;

    const x = Math.max(pad, Math.random() * maxX);
    const y = Math.max(pad, Math.random() * maxY);

    noBtn.style.left = x + "px";
    noBtn.style.top  = y + "px";
    noBtn.style.right = "auto"; // override initial right positioning after first move
  }

  // Mobile: use pointer events (works for touch + mouse)
  noBtn.addEventListener("pointerenter", moveNo);
  noBtn.addEventListener("pointerdown", () => {
    // shrink on tap
    scale -= 0.12;
    if(scale < 0.35) scale = 0.35;
    noBtn.style.transform = "scale(" + scale + ")";
    moveNo();
  });

  function playMusic(){
    const music = document.getElementById("music");
    music.volume = 0.85;

    music.play().then(() => {
      const playBtn = document.getElementById("play");
      playBtn.textContent = "Playing 🎶";
      playBtn.disabled = true;
      playBtn.style.opacity = "0.85";
      playBtn.style.cursor = "default";
    }).catch((e) => {
      console.log("Playback blocked:", e);
    });
  }

  function yes(){
    // DO NOT replace whole body (keeps music playing)
    document.getElementById("content").innerHTML =
      '<h1 class="success">REN is the happiest ❤️🎉</h1>';

    setInterval(()=>{
      const heart = document.createElement("div");
      heart.className = "hearts";
      heart.style.left = (Math.random()*100) + "vw";
      heart.textContent = "❤️";
      document.body.appendChild(heart);
      setTimeout(()=>heart.remove(), 3000);
    }, 180);
  }
</script>

</body>
</html>
